<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>trove</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #FFFFFF; --fg: #111111; --sub: #6E6E73; --line: #E5E5EA; --field: #F2F2F4; --card: #FFFFFF;
  --t0: #ECEAE6; --t1: #E3E8EC; --t2: #E8EAE3; --t3: #EEE6E6; --t4: #E6E4EE; --t5: #E9ECEA;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --fg: #F5F5F7; --sub: #A1A1A6; --line: #2C2C2E; --field: #1C1C1E; --card: #2C2C2E;
    --t0: #26241F; --t1: #1F2428; --t2: #22251F; --t3: #2A2222; --t4: #24222B; --t5: #202523;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { font-family: Inter, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; transition: transform .15s ease, background-color .2s ease, color .2s ease; }
button:active { transform: scale(.96); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
input, textarea { font: inherit; color: var(--fg); }
input::placeholder, textarea::placeholder { color: var(--sub); }
svg { display: block; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

.app { max-width: 480px; margin: 0 auto; min-height: 100%; position: relative; }
.screen { padding: calc(24px + var(--safe-top)) 16px calc(108px + var(--safe-bottom)); }
.label-caps { font-size: 13px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: .6px; }
.sub { color: var(--sub); }
.empty { padding: 32px 0; text-align: center; font-size: 15px; color: var(--sub); }

/* 首页 */
.top { display: flex; align-items: baseline; justify-content: space-between; margin: 8px 0 16px; }
.logo { font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 3px; border-radius: 12px; background: var(--field); margin-bottom: 18px; }
.seg button { text-align: center; height: 34px; border-radius: 9px; font-size: 13px; font-weight: 600; text-align: center; color: var(--sub); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.feed { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 20px; }
.card { display: flex; flex-direction: column; gap: 8px; }
.card-open { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.thumb { position: relative; width: 100%; border-radius: 16px; margin-bottom: 2px; overflow: hidden; background-size: cover; background-position: center; }
.pill { position: absolute; top: 10px; left: 10px; display: flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 12px; font-weight: 600; }
.pill.yes { background: var(--fg); color: var(--bg); }
.pill.no { background: var(--bg); color: var(--fg); }
.card-title { font-size: 14px; font-weight: 600; line-height: 1.3; padding: 0 2px; }
.card-meta { font-size: 13px; padding: 0 2px; color: var(--sub); }
.card-foot { display: flex; justify-content: space-between; align-items: center; padding: 0 2px; font-size: 12px; color: var(--sub); gap: 6px; }
.who { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; }
.chip-btn { display: flex; align-items: center; gap: 4px; height: 30px; padding: 0 10px; border-radius: 15px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); color: var(--fg); flex-shrink: 0; }
.chip-btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* 搜索 */
.search { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 12px; background: var(--field); color: var(--sub); margin: 8px 0 20px; }
.search input { flex: 1; border: 0; outline: none; background: transparent; font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.chips button { height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid var(--line); font-size: 14px; }
.row { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); width: 100%; }
.row-thumb { width: 64px; height: 64px; flex-shrink: 0; border-radius: 12px; background-size: cover; background-position: center; }
.row-title { font-size: 15px; font-weight: 600; line-height: 1.3; }
.row-meta { font-size: 13px; color: var(--sub); margin-top: 4px; }

/* 发帖 */
.post { display: flex; flex-direction: column; gap: 22px; animation: rise .3s ease; padding-bottom: calc(32px + var(--safe-bottom)); }
.post-head { display: flex; justify-content: space-between; align-items: center; }
.post-head h1 { font-size: 17px; font-weight: 600; margin: 0; }
.btn-primary { height: 36px; padding: 0 18px; border-radius: 18px; background: var(--fg); color: var(--bg); font-size: 15px; font-weight: 600; }
.btn-text { font-size: 16px; color: var(--sub); height: 44px; }
.photos { display: flex; gap: 10px; flex-wrap: wrap; }
.photo-add { width: 112px; height: 112px; border-radius: 16px; border: 1.5px dashed var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--sub); font-size: 13px; }
.photo { position: relative; width: 112px; height: 112px; border-radius: 16px; background-size: cover; background-position: center; }
.photo button { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 14px; background: rgba(0,0,0,.6); color: #fff; display: flex; align-items: center; justify-content: center; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--sub); }
.field input, .field textarea { border: 0; border-bottom: 1px solid var(--line); outline: none; background: transparent; padding: 8px 0; font-size: 16px; }
.field textarea { border-bottom: 0; resize: none; line-height: 1.5; padding: 4px 0; }
.field input.big { font-size: 18px; font-weight: 600; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.two.wide { gap: 14px; }
.verdict-btn { height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; border: 1px solid var(--line); }
.verdict-btn[aria-pressed="true"], .vote-btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* 我的 */
.profile { display: flex; align-items: center; gap: 16px; margin: 24px 0 20px; }
.avatar { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 12px 0 28px; }
.grid2 .thumb { height: 150px; }

/* 详情 */
.detail { position: fixed; inset: 0; background: var(--bg); animation: rise .3s ease; z-index: 20; }
.detail-inner { max-width: 480px; margin: 0 auto; height: 100%; overflow-y: auto; padding-bottom: calc(100px + var(--safe-bottom)); }
.hero { height: 400px; position: relative; background-size: cover; background-position: center; }
.hero-strip { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; height: 100%; }
.hero-strip div { flex: 0 0 100%; scroll-snap-align: start; background-size: cover; background-position: center; }
.back { position: absolute; top: calc(16px + var(--safe-top)); left: 16px; width: 44px; height: 44px; border-radius: 22px; background: var(--bg); display: flex; align-items: center; justify-content: center; }
.detail-body { padding: 20px 16px 32px; display: flex; flex-direction: column; gap: 16px; }
.author-row { display: flex; align-items: center; justify-content: space-between; }
.author-row .who { font-size: 14px; font-weight: 600; color: var(--fg); gap: 10px; }
.author-row .dot { width: 32px; height: 32px; }
.btn-outline { height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid var(--line); font-size: 14px; font-weight: 600; }
.btn-outline[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.d-title { font-size: 22px; font-weight: 700; line-height: 1.25; letter-spacing: -.3px; margin: 0; }
.verdict-box { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: var(--field); }
.verdict-box .pill { position: static; height: 30px; padding: 0 12px; font-size: 13px; }
.place { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--sub); }
.d-text { font-size: 16px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.agree-box { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 16px; border: 1px solid var(--line); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar div { height: 100%; background: var(--fg); transition: width .35s ease; }
.vote-btn { height: 44px; border-radius: 12px; text-align: center; font-size: 15px; font-weight: 600; border: 1px solid var(--line); }
.q { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.5; }
.q b { font-weight: 600; margin-right: 6px; }
.ask { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg); border-top: 1px solid var(--line); }
.ask form { max-width: 480px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 16px calc(12px + var(--safe-bottom)); }
.ask label { flex: 1; height: 40px; border-radius: 20px; background: var(--field); display: flex; align-items: center; padding: 0 16px; }
.ask input { border: 0; outline: none; background: transparent; width: 100%; font-size: 15px; }
.icon-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* 底部导航 */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg); border-top: 1px solid var(--line); }
.tabs nav { max-width: 480px; margin: 0 auto; height: calc(64px + var(--safe-bottom)); padding: 8px 24px var(--safe-bottom); display: flex; justify-content: space-between; align-items: center; }
.tabs button { width: 48px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--sub); }
.tabs button[aria-current="page"] { color: var(--fg); }
.tabs .new { width: 52px; height: 40px; border-radius: 12px; background: var(--fg); color: var(--bg); }

/* 注册 / 登录 */
.auth { max-width: 420px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; gap: 20px; padding: calc(24px + var(--safe-top)) 24px calc(32px + var(--safe-bottom)); }
main.auth { justify-content: space-between; }
.auth-hero { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding-top: 48px; }
.auth-logo { font-size: 56px; font-weight: 700; letter-spacing: -2px; }
.auth-hero p { font-size: 18px; line-height: 1.5; margin: 0; color: var(--sub); max-width: 22em; }
.auth-actions { display: flex; flex-direction: column; gap: 12px; }
.auth-title { font-size: 30px; font-weight: 700; letter-spacing: -.6px; margin: 4px 0 0; }
.auth .seg { margin: 0; }
.back-plain { width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; }
.btn-social { height: 52px; border-radius: 14px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 600; }
.btn-big { height: 52px; border-radius: 14px; background: var(--fg); color: var(--bg); font-size: 16px; font-weight: 600; text-align: center; width: 100%; }
.btn-big.ghost { background: transparent; color: var(--fg); }
.btn-big.danger-outline { background: transparent; color: var(--danger); border: 1px solid var(--line); }
.auth-switch { text-align: center; font-size: 15px; color: var(--sub); margin: 4px 0 0; }
.link { color: var(--fg); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; min-height: 44px; }
.or { display: flex; align-items: center; gap: 12px; color: var(--sub); font-size: 13px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.hint { font-size: 12px; color: var(--sub); }
.at { display: flex; align-items: center; border-bottom: 1px solid var(--line); font-size: 16px; color: var(--sub); }
.at input { flex: 1; border: 0 !important; }
.pw { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
.pw input { flex: 1; border: 0 !important; }
.pw-eye { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--sub); }
.err { color: var(--danger); font-size: 14px; line-height: 1.4; }
:root { --danger: #C4321F; }
@media (prefers-color-scheme: dark) { :root { --danger: #FF8A75; } }

/* 我的 / 账号设置 */
.me-top { display: flex; justify-content: flex-end; margin: -8px -10px -24px 0; }
.row-link { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border-radius: 14px; background: var(--field); font-size: 15px; font-weight: 600; }
.row-link .sub { margin-left: auto; font-size: 13px; font-weight: 400; }
.bar-head { display: flex; align-items: center; justify-content: space-between; margin: -4px -10px 16px; }
.bar-head h1 { font-size: 17px; font-weight: 600; margin: 0; }
.acct-card { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 16px; background: var(--field); margin-bottom: 24px; }
.acct-list { margin-top: 8px; border-top: 1px solid var(--line); }
.acct-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.acct-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--field); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.acct-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; font-size: 15px; font-weight: 600; }
.acct-text .sub { font-size: 13px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn-outline.small { height: 34px; padding: 0 14px; font-size: 13px; flex-shrink: 0; }

/* 底部弹出面板 */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet { width: 100%; max-width: 480px; background: var(--bg); border-radius: 20px 20px 0 0; padding: 10px 20px calc(20px + var(--safe-bottom)); display: flex; flex-direction: column; gap: 16px; animation: rise .25s ease; max-height: 90vh; overflow-y: auto; }
.sheet h2 { font-size: 20px; font-weight: 700; margin: 4px 0 0; }
.sheet-grip { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto; }
.sheet .btn-big.ghost { height: 44px; }

/* 评论和回复 */
.cmt-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 8px 0 4px; flex-wrap: wrap; }
.thread { border-bottom: 1px solid var(--line); padding: 4px 0; }
.cmt { display: flex; gap: 10px; width: calc(100% + 16px); padding: 10px 8px; margin: 0 -8px; border-radius: 12px; }
.cmt:active { transform: none; background: var(--field); }
.cmt.active { background: var(--field); }
.cmt.reply { padding-left: 46px; }
.cmt .dot { margin-top: 2px; }
.cmt-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.cmt-head { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.cmt-head b { font-weight: 600; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 8px; background: var(--fg); color: var(--bg); }
.cmt-text { font-size: 15px; line-height: 1.45; overflow-wrap: anywhere; }
.cmt-text .to { color: var(--sub); font-weight: 600; }
.cmt-reply { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--sub); margin-top: 2px; }
.replying { max-width: 480px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 16px; font-size: 13px; color: var(--sub); border-bottom: 1px solid var(--line); }
.replying b { color: var(--fg); }

.toast { position: fixed; left: 50%; top: calc(16px + var(--safe-top)); transform: translateX(-50%) translateY(-20px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 20px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; max-width: 90vw; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
.toast.show { opacity: 1; transform: translateX(-50%); }

</style>
</head>

; return module.exports; })();

  const PHONE_RE = /^\+?\d{7,15}$/;
  const SESSION_MS = 60 * 24 * 3600 * 1000; // 登录 60 天有效
  const MAX_FAILS = 5; // 连续输错几次锁定
  const LOCK_MS = 15 * 60 * 1000;
  const MIN_PASSWORD = 8;

  class HttpError extends Error {
    constructor(status, message) { super(message); this.status = status; }
  }
  const fail = (status, message) => { throw new HttpError(status, message); };

  const normEmail = (v) => String(v || '').trim().toLowerCase();
  const normPhone = (v) => String(v || '').trim().replace(/[\s\-().]/g, '');
  const isEmail = (e) => e.length <= 254 && EMAIL_RE.test(e);
  const isPhone = (p) => PHONE_RE.test(p);

  // 旧数据文件可能缺一些字段，补齐
  function upgrade(db) {
    db.notes = db.notes || [];
    db.users = db.users || {};
    db.sessions = db.sessions || {};
    for (const u of Object.values(db.users)) {
      u.email = u.email || null;
      u.phone = u.phone || null;
      u.pass = u.pass || null;
      u.google = u.google || null;
      u.saved = u.saved || [];
      u.following = u.following || [];
    }
    for (const n of db.notes) {
      n.questions = (n.questions || []).map((q) => ({ replyTo: null, ...q }));
    }
    return db;
  }

  function createCore(opts) {
    const { save, hashPassword, verifyPassword, randomToken } = opts;
    const savePhoto = opts.savePhoto || ((p) => p);
    const now = opts.now || (() => Date.now());
    const googleEnabled = !!opts.googleEnabled;
    const db = upgrade(opts.db);
    const fails = new Map(); // 登录失败计数（只在内存里）

    const iso = () => new Date(now()).toISOString();
    const nextId = () => (db.lastId = (db.lastId || 0) + 1);
    const users = () => Object.values(db.users);
    const byEmail = (e) => users().find((u) => u.email === e) || null;
    const byPhone = (p) => users().find((u) => u.phone === p) || null;
    const sorted = () => [...db.notes].sort((a, b) => b.createdAt.localeCompare(a.createdAt));

    function account(u) {
      return {
        username: u.name,
        email: u.email,
        phone: u.phone,
        google: u.google ? { email: u.google.email } : null,
        hasPassword: !!u.pass,
        createdAt: u.createdAt
      };
    }

    function newUser(name, fields) {
      const u = { name, email: null, phone: null, pass: null, google: null, saved: [], following: [], createdAt: iso(), ...fields };
      db.users[name] = u;
      return u;
    }

    async function startSession(u) {
      const token = await randomToken();
      db.sessions[token] = { user: u.name, expires: now() + SESSION_MS };
      save();
      return { token, account: account(u) };
    }

    function userFromToken(token) {
      const s = token && db.sessions[token];
      if (!s) return null;
      if (s.expires < now()) { delete db.sessions[token]; save(); return null; }
      return db.users[s.user] || null;
    }

    function checkUsername(name) {
      if (!NAME_RE.test(name)) fail(400, 'Username: 2–20 characters, lowercase letters, numbers, . or _');
      if (db.users[name]) fail(409, 'That username is taken');
    }

    function checkPassword(p) {
      if (typeof p !== 'string' || p.length < MIN_PASSWORD) fail(400, `Password must be at least ${MIN_PASSWORD} characters`);
      if (p.length > 200) fail(400, 'Password is too long');
    }

    async function requireCurrentPassword(u, current) {
      if (!u.pass) return; // 只用 Google 登录、还没设密码的账号
      if (!current || !(await verifyPassword(String(current), u.pass))) fail(403, 'Current password is wrong');
    }

    // 用户名不能和 Google 名字冲突：从邮箱前缀生成一个可用的
    function freeUsername(base) {
      let stem = String(base || 'user').toLowerCase().replace(/[^a-z0-9._]/g, '').slice(0, 16);
      if (stem.length < 2) stem = 'user';
      let name = stem;
      for (let i = 2; db.users[name]; i++) name = stem + i;
      return name;
    }

    // ---------- Google（服务器拿到 Google 资料后调用） ----------
    async function googleSignIn(profile) {
      if (!profile || !profile.sub) fail(400, 'Google did not return an account');
      let u = users().find((x) => x.google && x.google.sub === profile.sub);
      const email = normEmail(profile.email);
      if (!u && email && profile.email_verified) {
        // 已经用同一个邮箱注册过：直接关联
        u = byEmail(email);
        if (u) u.google = { sub: profile.sub, email };
      }
      if (!u) {
        u = newUser(freeUsername(email.split('@')[0]), {
          email: email && profile.email_verified && !byEmail(email) ? email : null,
          google: { sub: profile.sub, email }
        });
      }
      return startSession(u);
    }

    function linkGoogle(u, profile) {
      const other = users().find((x) => x.google && x.google.sub === profile.sub);
      if (other && other !== u) fail(409, 'That Google account is already linked to @' + other.name);
      u.google = { sub: profile.sub, email: normEmail(profile.email) };
      save();
      return account(u);
    }

    // ---------- 帖子展示 ----------
    function view(note, me) {
      const votes = Object.values(note.votes);
      const agree = note.baseAgree + votes.filter((v) => v === 1).length;
      const disagree = note.baseDisagree + votes.filter((v) => v === -1).length;
      const total = agree + disagree;
      return {
        id: note.id, author: note.author, title: note.title, body: note.body, worth: note.worth,
        place: note.place, price: note.price, photos: note.photos, tint: note.tint,
        agree, disagree, total, pct: total ? Math.round((agree * 100) / total) : 0,
        likes: note.baseLikes + note.likes.length,
        questions: note.questions.map((q) => ({ ...q, isAuthor: q.author === note.author })),
        createdAt: note.createdAt,
        myVote: me ? note.votes[me.name] || 0 : 0,
        liked: me ? note.likes.includes(me.name) : false,
        saved: me ? me.saved.includes(note.id) : false,
        following: me ? me.following.includes(note.author) : false
      };
    }

    // ---------- 路由 ----------
    async function handle(method, url, { token, body } = {}) {
      const u = new URL(url, 'http://local');
      const path = u.pathname.replace(/\/+$/, '');
      const parts = path.split('/').filter(Boolean); // ['api', 'notes', '3', 'vote']
      const b = body && typeof body === 'object' ? body : {};
      const me = userFromToken(token);
      const needUser = () => me || fail(401, 'Please log in');
      const ok = (data, status = 200) => ({ status, data });
      const key = method + ' ' + path;

      // ----- 账号 -----
      if (key === 'GET /api/config') return ok({ google: googleEnabled });

      if (key === 'POST /api/auth/signup') {
        const name = String(b.username || '').trim().toLowerCase();
        checkUsername(name);
        const email = b.email ? normEmail(b.email) : null;
        const phone = b.phone ? normPhone(b.phone) : null;
        if (!email && !phone) fail(400, 'Enter an email or a phone number');
        if (email && !isEmail(email)) fail(400, 'That email does not look right');
        if (phone && !isPhone(phone)) fail(400, 'Phone number: 7–15 digits, can start with +');
        if (email && byEmail(email)) fail(409, 'That email already has an account. Log in instead');
        if (phone && byPhone(phone)) fail(409, 'That phone number already has an account. Log in instead');
        checkPassword(b.password);
        const u = newUser(name, { email, phone, pass: await hashPassword(b.password) });
        const r = await startSession(u);
        return ok(r, 201);
      }

      if (key === 'POST /api/auth/login') {
        const raw = String(b.id || '').trim();
        if (!raw || !b.password) fail(400, 'Enter your email, phone or username, and your password');
        const lockKey = raw.toLowerCase();
        const f = fails.get(lockKey);
        if (f && f.count >= MAX_FAILS && f.until > now()) {
          fail(429, `Too many tries. Wait ${Math.ceil((f.until - now()) / 60000)} min and try again`);
        }
        let user;
        if (raw.includes('@')) user = byEmail(normEmail(raw));
        else if (isPhone(normPhone(raw))) user = byPhone(normPhone(raw));
        else user = db.users[raw.toLowerCase()] || null;
        const good = user && user.pass && (await verifyPassword(String(b.password), user.pass));
        if (!good) {
          const cur = f && f.until > now() ? f : { count: 0 };
          fails.set(lockKey, { count: cur.count + 1, until: now() + LOCK_MS });
          if (user && !user.pass && user.google) fail(401, 'This account uses Google. Continue with Google instead');
          fail(401, 'Wrong login or password');
        }
        fails.delete(lockKey);
        return ok(await startSession(user));
      }

      if (key === 'POST /api/auth/logout') {
        if (token) { delete db.sessions[token]; save(); }
        return ok({ ok: true });
      }

      if (key === 'GET /api/account') return ok(account(needUser()));

      if (key === 'PATCH /api/account') {
        const usr = needUser();
        await requireCurrentPassword(usr, b.currentPassword);
        if ('email' in b) {
          const email = b.email ? normEmail(b.email) : null;
          if (email && !isEmail(email)) fail(400, 'That email does not look right');
          const other = email && byEmail(email);
          if (other && other !== usr) fail(409, 'That email is used by another account');
          if (!email && !usr.pass && !usr.google) fail(400, 'You need at least one way to log in');
          usr.email = email;
        }
        if ('phone' in b) {
          const phone = b.phone ? normPhone(b.phone) : null;
          if (phone && !isPhone(phone)) fail(400, 'Phone number: 7–15 digits, can start with +');
          const other = phone && byPhone(phone);
          if (other && other !== usr) fail(409, 'That phone number is used by another account');
          usr.phone = phone;
        }
        save();
        return ok(account(usr));
      }

      if (key === 'POST /api/account/password') {
        const usr = needUser();
        await requireCurrentPassword(usr, b.currentPassword);
        checkPassword(b.newPassword);
        usr.pass = await hashPassword(b.newPassword);
        // 改密码后，其他设备上的登录全部失效
        for (const [t, s] of Object.entries(db.sessions)) if (s.user === usr.name && t !== token) delete db.sessions[t];
        save();
        return ok(account(usr));
      }

      if (key === 'DELETE /api/account/google') {
        const usr = needUser();
        if (!usr.pass) fail(400, 'Set a password first, so you can still log in without Google');
        usr.google = null;
        save();
        return ok(account(usr));
      }

      // ----- 帖子 -----
      if (key === 'GET /api/notes') {
        const filter = u.searchParams.get('filter') || 'all';
        const q = (u.searchParams.get('q') || '').trim().toLowerCase();
        let notes = sorted();
        if (filter === 'yes') notes = notes.filter((n) => n.worth === true);
        if (filter === 'no') notes = notes.filter((n) => n.worth === false);
        if (q) notes = notes.filter((n) => [n.title, n.body, n.place, n.author].join(' ').toLowerCase().includes(q));
        return ok(notes.map((n) => view(n, me)));
      }

      if (key === 'GET /api/me') {
        const usr = needUser();
        return ok({
          name: usr.name,
          account: account(usr),
          following: usr.following,
          saved: usr.saved.map((id) => db.notes.find((n) => n.id === id)).filter(Boolean).map((n) => view(n, usr)),
          mine: sorted().filter((n) => n.author === usr.name).map((n) => view(n, usr))
        });
      }

      if (key === 'POST /api/notes') {
        const usr = needUser();
        const title = String(b.title || '').trim();
        const text = String(b.body || '').trim();
        if (!title) fail(400, 'Add a title first');
        if (title.length > 120) fail(400, 'Title: 120 characters at most');
        if (text.length > 5000) fail(400, 'Story: 5000 characters at most');
        const photosIn = Array.isArray(b.photos) ? b.photos : [];
        if (photosIn.length > 4) fail(400, '4 photos at most');
        const photos = [];
        for (const p of photosIn) photos.push(await savePhoto(p));
        const note = {
          id: nextId(), author: usr.name, title, body: text,
          worth: b.worth === true ? true : b.worth === false ? false : null,
          place: String(b.place || '').trim().slice(0, 80), price: String(b.price || '').trim().slice(0, 20),
          photos, tint: Math.floor(Math.random() * 6), votes: {}, likes: [],
          baseAgree: 0, baseDisagree: 0, baseLikes: 0, questions: [], createdAt: iso()
        };
        db.notes.push(note);
        save();
        return ok(view(note, usr), 201);
      }

      if (parts[1] === 'users' && parts[3] === 'follow' && method === 'POST' && parts.length === 4) {
        const usr = needUser();
        const target = decodeURIComponent(parts[2]).toLowerCase();
        if (!NAME_RE.test(target)) fail(400, 'Unknown user');
        if (target === usr.name) fail(400, 'You cannot follow yourself');
        const i = usr.following.indexOf(target);
        if (i >= 0) usr.following.splice(i, 1); else usr.following.push(target);
        save();
        return ok({ following: i < 0 });
      }

      if (parts[1] === 'notes' && parts.length >= 3) {
        const note = db.notes.find((n) => n.id === Number(parts[2]));
        if (!note) fail(404, 'Note not found');
        if (method === 'GET' && parts.length === 3) return ok(view(note, me));
        const action = method === 'POST' && parts.length === 4 ? parts[3] : null;
        const usr = action ? needUser() : null;

        if (action === 'vote') {
          if (note.worth === null) fail(400, 'This note has no verdict to vote on');
          const v = Number(b.value);
          if (![1, -1, 0].includes(v)) fail(400, 'value must be 1, -1 or 0');
          if (v === 0) delete note.votes[usr.name]; else note.votes[usr.name] = v;
        } else if (action === 'like') {
          const i = note.likes.indexOf(usr.name);
          if (i >= 0) note.likes.splice(i, 1); else note.likes.push(usr.name);
        } else if (action === 'save') {
          const i = usr.saved.indexOf(note.id);
          if (i >= 0) usr.saved.splice(i, 1); else usr.saved.push(note.id);
        } else if (action === 'questions') {
          const text = String(b.text || '').trim();
          if (!text) fail(400, 'Write something first');
          if (text.length > 500) fail(400, '500 characters at most');
          let replyTo = null;
          if (b.replyTo != null) {
            const parent = note.questions.find((q) => q.id === Number(b.replyTo));
            if (!parent) fail(400, 'That comment no longer exists');
            replyTo = parent.id;
          }
          note.questions.push({ id: nextId(), author: usr.name, text, replyTo, createdAt: iso() });
          save();
          return ok(view(note, usr), 201);
        } else {
          fail(404, 'Not found');
        }
        save();
        return ok(view(note, usr));
      }

      fail(404, 'Not found');
    }

    return { handle, userFromToken, googleSignIn, linkGoogle, account };
  }

  return { createCore, HttpError, upgrade, NAME_RE };
});

</script>
<script>
// 演示版用的"本地后端"：不需要服务器，用和服务器同一份 core.js，数据存在浏览器里。
// 需要先加载 window.TROVE_SEED（示例数据）和 window.TroveCore（core.js）。
(() => {
  'use strict';
  const KEY = 'trove.demo.db';
  const enc = new TextEncoder();
  const hex = (buf) => [...new Uint8Array(buf)].map((x) => x.toString(16).padStart(2, '0')).join('');
  const unhex = (h) => new Uint8Array((h.match(/../g) || []).map((x) => parseInt(x, 16)));

  // 浏览器里用 PBKDF2 加密密码
  async function pbkdf2(password, salt) {
    const key = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
    return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: 210000 }, key, 256);
  }
  async function hashPassword(password) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    return `pbkdf2$${hex(salt)}$${hex(await pbkdf2(password, salt))}`;
  }
  async function verifyPassword(password, stored) {
    const [algo, salt, hash] = String(stored).split('$');
    if (algo !== 'pbkdf2') return false;
    return hex(await pbkdf2(password, unhex(salt))) === hash;
  }

  function load() {
    try { const d = JSON.parse(localStorage.getItem(KEY)); if (d) return d; } catch (e) { /* ignore */ }
    return window.TROVE_SEED();
  }

  let core;
  function boot(db) {
    core = window.TroveCore.createCore({
      db,
      save: () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { /* 存不下就只留在内存里 */ } },
      hashPassword,
      verifyPassword,
      randomToken: () => hex(crypto.getRandomValues(new Uint8Array(32))),
      googleEnabled: false
    });
  }
  boot(load());

  window.TROVE_LOCAL_API = async (path, { method = 'GET', token, body } = {}) => {
    try {
      // 走一遍 JSON，和真的网络请求一样拿到的是拷贝
      const r = await core.handle(method, path, { token, body: body ? JSON.parse(JSON.stringify(body)) : undefined });
      return JSON.parse(JSON.stringify(r.data));
    } catch (e) {
      if (e instanceof window.TroveCore.HttpError) { const err = new Error(e.message); err.status = e.status; throw err; }
      throw e;
    }
  };
  window.TROVE_LOCAL_RESET = () => {
    try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
    boot(window.TROVE_SEED());
  };
})();

</script>
<script>
// trove 前端：一个不依赖框架的单页应用。
(() => {
  'use strict';

  const $app = document.getElementById('app');
  const $toast = document.getElementById('toast');

  // 有些环境（比如嵌在别的页面里）不允许用 localStorage，出错时就当没有
  const storage = {
    get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
    remove: (k) => { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
  };
  let pushed = false; // 打开详情时是否往浏览器历史里加了一条

  const state = {
    token: storage.get('trove.token') || '',
    account: null, // 登录后的账号信息
    config: { google: false },
    // 未登录时的页面
    auth: 'welcome', // welcome | signup | login
    authMethod: 'email', // email | phone
    authForm: { username: '', email: '', phone: '', id: '', password: '' },
    authError: '',
    showPassword: false,
    // 登录后的页面
    tab: 'home', // home | search | post | me | account
    filter: 'all',
    query: '',
    notes: [],
    me: null,
    detail: null,
    replyTo: null, // { id, author } 正在回复的评论
    askText: '',
    draft: emptyDraft(),
    sheet: null, // 账号设置里弹出的面板：email | phone | password | google-off
    sheetForm: {},
    sheetError: '',
    busy: false
  };

  function emptyDraft() {
    return { title: '', body: '', worth: null, place: '', price: '', photos: [] };
  }

  // ---------- 小工具 ----------
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const tint = (n) => `var(--t${(n.tint ?? 0) % 6})`;
  const nameTint = (name) => `var(--t${[...String(name)].reduce((a, c) => a + c.charCodeAt(0), 0) % 6})`;
  const bgStyle = (n) => n.photos && n.photos.length
    ? `background-color:${tint(n)};background-image:url('${esc(n.photos[0])}')`
    : `background-color:${tint(n)}`;
  const heights = [220, 210, 170, 230, 190, 200, 160];
  const verdictLabel = (n) => n.worth === true ? 'Worth it' : n.worth === false ? 'Not worth it' : '';
  const meta = (n) => [n.price, n.place].filter(Boolean).join(' · ');
  const me = () => (state.account ? state.account.username : '');
  const ago = (iso) => {
    const s = (Date.now() - Date.parse(iso)) / 1000;
    if (s < 60) return 'now';
    if (s < 3600) return Math.floor(s / 60) + 'm';
    if (s < 86400) return Math.floor(s / 3600) + 'h';
    return Math.floor(s / 86400) + 'd';
  };

  const icon = {
    check: (s = 12, w = 3) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>`,
    x: (s = 12, w = 3) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>`,
    up: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>`,
    heart: (fill = 'currentColor', s = 12) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${fill}" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.4-9-9a4.8 4.8 0 0 1 9-3 4.8 4.8 0 0 1 9 3c-2 4.6-9 9-9 9z"/></svg>`,
    bookmark: (fill) => `<svg width="22" height="22" viewBox="0 0 24 24" fill="${fill}" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>`,
    search: (s = 24) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${s < 24 ? 2 : 1.8}" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`,
    home: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>`,
    plus: (s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`,
    user: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>`,

  };

  let toastTimer;
  function toast(msg) {
    $toast.textContent = msg;
    $toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $toast.classList.remove('show'), 2400);
  }

  async function api(path, opts = {}) {
    const method = opts.method || 'GET';
    let data;
    try {
      if (window.TROVE_LOCAL_API) {
        // 演示版：没有服务器，交给浏览器里的本地后端处理
        data = await window.TROVE_LOCAL_API(path, { method, token: state.token, body: opts.body });
      } else {
        const res = await fetch(path, {
          method,
          headers: { 'Content-Type': 'application/json', ...(state.token ? { Authorization: 'Bearer ' + state.token } : {}) },
          body: opts.body ? JSON.stringify(opts.body) : undefined
        });
        data = await res.json().catch(() => ({}));
        if (!res.ok) { const e = new Error(data.error || 'Something went wrong'); e.status = res.status; throw e; }
      }
    } catch (e) {
      // 登录过期：回到登录页
      if (e.status === 401 && state.token && !opts.noLogout) {
        signedOut('Please log in again');
      }
      throw e;
    }
    return data;
  }

  // ---------- 登录状态 ----------
  function signedIn(r) {
    state.token = r.token;
    state.account = r.account;
    storage.set('trove.token', r.token);
    state.authForm = { username: '', email: '', phone: '', id: '', password: '' };
    state.authError = '';
    state.showPassword = false;
    state.draft = emptyDraft();
    state.filter = 'all';
    go('home');
  }

  function signedOut(message) {
    state.token = '';
    state.account = null;
    state.me = null;
    state.detail = null;
    state.sheet = null;
    storage.remove('trove.token');
    state.auth = message ? 'login' : 'welcome';
    state.authError = message || '';
    render();
  }

  async function startGoogle(mode) {
    if (!state.config.google) {
      const msg = window.TROVE_LOCAL_API
        ? 'Google sign-in needs the server version. In this demo, use email or phone.'
        : 'Google sign-in is not set up on this server yet. Use email or phone for now.';
      if (mode === 'link') toast(msg); else { state.authError = msg; render(); }
      return;
    }
    try {
      const r = await api('/api/auth/google/start', { method: 'POST', body: { mode } });
      window.location.href = r.url;
    } catch (e) { toast(e.message); }
  }

  // ---------- 数据 ----------
  async function loadNotes() {
    const p = new URLSearchParams();
    if (state.tab === 'home' && state.filter !== 'all') p.set('filter', state.filter);
    if (state.tab === 'search' && state.query.trim()) p.set('q', state.query.trim());
    state.notes = await api('/api/notes?' + p);
  }

  async function loadMe() {
    state.me = await api('/api/me');
    state.account = state.me.account;
  }

  // 用服务器返回的新数据替换本地缓存里的同一条帖子
  function replaceNote(n) {
    state.notes = state.notes.map((x) => (x.id === n.id ? n : x));
    if (state.detail && state.detail.id === n.id) state.detail = n;
    if (state.me) {
      state.me.saved = n.saved
        ? (state.me.saved.some((x) => x.id === n.id) ? state.me.saved.map((x) => (x.id === n.id ? n : x)) : [n, ...state.me.saved])
        : state.me.saved.filter((x) => x.id !== n.id);
      state.me.mine = state.me.mine.map((x) => (x.id === n.id ? n : x));
    }
  }

  const googleBtn = (label) => `<button type="button" class="btn-social" data-google="login">${icon.google}${label}</button>`;
  const errBox = (msg) => `<div class="err" role="alert">${esc(msg)}</div>`;

  function passwordField(name, label, autocomplete, value) {
    return `<label class="field">${label}

        <input type="${state.showPassword ? 'text' : 'password'}" data-af="${name}" value="${esc(value)}" autocomplete="${autocomplete}" maxlength="200" required>
        <button type="button" class="pw-eye" data-toggle-pw aria-label="${state.showPassword ? 'Hide password' : 'Show password'}">${icon.eye(!state.showPassword)}</button>
      </span>

  }

  // ---------- 首页 ----------
  function card(n, i) {
    const has = n.worth !== null;
    const h = n.photos.length ? heights[i % heights.length] + 20 : heights[n.id % heights.length];
    return `<div class="card">
      <button class="card-open" data-open="${n.id}" aria-label="${esc(n.title)}">

          ${has ? `<span class="pill ${n.worth ? 'yes' : 'no'}">${n.worth ? icon.check() : icon.x()}${verdictLabel(n)}</span>` : ''}

  function viewHome() {
    const f = [['all', 'All'], ['yes', 'Worth it'], ['no', 'Not worth it']];
    const left = state.notes.filter((_, i) => i % 2 === 0);

      <div class="top"><div class="logo">trove</div><div class="sub" style="font-size:13px">Champaign, IL</div></div>

        ? `<div class="feed"><div class="col">${left.map((n, i) => card(n, i * 2)).join('')}</div><div class="col">${right.map((n, i) => card(n, i * 2 + 1)).join('')}</div></div>`

  // ---------- 搜索 ----------
  function resultRows() {
    if (!state.notes.length) return `<div class="empty">No verdicts yet. Be the first to post one.</div>`;

    }).join('');

  function viewSheet() {

    let title, body, submit = 'Save', extra = '';
    if (s === 'email') {
      title = a.email ? 'Change email' : 'Add email';
      body = `<label class="field">Email<input type="email" data-sf="email" value="${esc(f.email ?? a.email ?? '')}" autocomplete="email" autocapitalize="none" placeholder="you@illinois.edu"></label>${current}`;

    } else if (s === 'phone') {
      title = a.phone ? 'Change phone' : 'Add phone';
      body = `<label class="field">Phone number<input type="tel" data-sf="phone" value="${esc(f.phone ?? a.phone ?? '')}" autocomplete="tel" placeholder="+1 217 555 0123"></label>${current}`;
      if (a.phone) extra = `<button type="button" class="btn-big ghost" data-sheet-remove="phone">Remove phone</button>`;
    } else if (s === 'password') {
      title = a.hasPassword ? 'Change password' : 'Set a password';
      body = `${current}<label class="field">New password<input type="password" data-sf="newPassword" value="${esc(f.newPassword || '')}" autocomplete="new-password" required><span class="hint">At least 8 characters. Other devices will be logged out.</span></label>`;
    } else if (s === 'google-off') {
      title = 'Disconnect Google?';
      body = `<p class="sub" style="margin:0;line-height:1.5">You will no longer be able to log in with ${esc(a.google.email)}. ${a.hasPassword ? 'You can still log in with your password.' : 'Set a password first so you can still log in.'}</p>`;
      submit = 'Disconnect';
    }
    return `<div class="sheet-wrap" data-sheet-close>
      <form class="sheet" data-form="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate>
        <div class="sheet-grip" aria-hidden="true"></div>
        <h2>${esc(title)}</h2>
        ${body}
        ${state.sheetError ? errBox(state.sheetError) : ''}
        <button type="submit" class="btn-big" ${state.busy ? 'disabled' : ''}>${state.busy ? 'Saving…' : submit}</button>
        ${extra}
        <button type="button" class="btn-big ghost" data-sheet-cancel>Cancel</button>
      </form>
    </div>`;
  }

  // ---------- 帖子详情 + 评论回复 ----------
  // 把评论整理成"楼"：每条顶层评论下面跟着它的所有回复（按时间）
  function threads(questions) {
    const byId = new Map(questions.map((q) => [q.id, q]));
    const rootOf = (q) => { let r = q; const seen = new Set(); while (r.replyTo && byId.has(r.replyTo) && !seen.has(r.id)) { seen.add(r.id); r = byId.get(r.replyTo); } return r; };
    const roots = questions.filter((q) => !q.replyTo || !byId.has(q.replyTo));
    return roots.map((root) => ({
      root,
      replies: questions.filter((q) => q !== root && rootOf(q) === root).map((q) => ({ ...q, parent: byId.get(q.replyTo) }))
    }));
  }

  function comment(q, isReply) {
    const active = state.replyTo && state.replyTo.id === q.id;
    const to = isReply && q.parent && q.parent.replyTo ? `<span class="to">@${esc(q.parent.author)}</span> ` : '';
    return `<button class="cmt${isReply ? ' reply' : ''}${active ? ' active' : ''}" data-reply="${q.id}" data-reply-author="${esc(q.author)}" aria-label="Reply to ${esc(q.author)}">
      <span class="dot" style="background:${nameTint(q.author)};width:${isReply ? 24 : 28}px;height:${isReply ? 24 : 28}px"></span>
      <span class="cmt-main">
        <span class="cmt-head"><b>${esc(q.author)}</b>${q.isAuthor ? '<span class="badge">Author</span>' : ''}<span class="sub">${ago(q.createdAt)}</span></span>
        <span class="cmt-text">${to}${esc(q.text)}</span>
        <span class="cmt-reply">${icon.reply}Reply</span>
      </span>
    </button>`;
  }

  function viewDetail() {
    const n = state.detail;
    const has = n.worth !== null;
    const mine = n.author === me();
    const hero = n.photos.length > 1
      ? `<div class="hero-strip">${n.photos.map((p) => `<div style="background-image:url('${esc(p)}')" role="img" aria-label="Photo"></div>`).join('')}</div>`
      : '';
    const th = threads(n.questions);
    const placeholder = state.replyTo ? `Reply to @${state.replyTo.author}…` : mine ? 'Add a comment…' : 'Ask the author…';
    return `<div class="detail" role="dialog" aria-modal="true" aria-label="${esc(n.title)}">
      <div class="detail-inner">
        <div class="hero" style="${n.photos.length > 1 ? `background:${tint(n)}` : bgStyle(n)}">
          ${hero}
          <button class="back" data-close aria-label="Back">${icon.back}</button>
        </div>
        <div class="detail-body">
          <div class="author-row">
            <span class="who"><span class="dot" style="background:${nameTint(n.author)}"></span>${esc(n.author)}</span>
            ${mine ? '' : `<button class="btn-outline" data-follow="${esc(n.author)}" aria-pressed="${n.following}">${n.following ? 'Following' : 'Follow'}</button>`}
          </div>
          <h2 class="d-title">${esc(n.title)}</h2>
          ${has ? `<div class="verdict-box"><span class="pill ${n.worth ? 'yes' : 'no'}">${verdictLabel(n)}</span><span style="font-size:15px;font-weight:600">${esc(meta(n))}</span></div>`
            : n.place ? `<div class="place">${icon.pin}${esc(n.place)}</div>` : ''}
          ${n.body ? `<div class="d-text">${esc(n.body)}</div>` : ''}
          ${has ? `<div class="agree-box">
            <div style="font-size:15px;font-weight:600">Do you agree?</div>
            <div class="bar"><div style="width:${n.pct}%"></div></div>
            <div class="sub" style="font-size:13px">${n.total ? `${n.pct}% of ${n.total} people agree` : 'No votes yet'}</div>
            <div class="two">
              <button class="vote-btn" data-vote="1" aria-pressed="${n.myVote === 1}">Agree</button>
              <button class="vote-btn" data-vote="-1" aria-pressed="${n.myVote === -1}">Disagree</button>
            </div>
          </div>` : ''}
          <div>
            <div class="cmt-title">
              <span class="label-caps">Questions &amp; answers · ${n.questions.length}</span>
              ${n.questions.length ? '<span class="sub" style="font-size:12px">Tap a comment to reply</span>' : ''}
            </div>
            ${th.length
              ? th.map((t) => `<div class="thread">${comment(t.root, false)}${t.replies.map((r) => comment(r, true)).join('')}</div>`).join('')
              : `<div class="sub" style="font-size:14px;padding:12px 0">${mine ? 'No questions yet. People can ask you about this below.' : `No questions yet. Ask ${esc(n.author)} below.`}</div>`}
          </div>
        </div>
      </div>
      <div class="ask">
        ${state.replyTo ? `<div class="replying"><span>Replying to <b>@${esc(state.replyTo.author)}</b></span><button type="button" class="icon-btn" data-cancel-reply aria-label="Cancel reply">${icon.x(14, 2.4)}</button></div>` : ''}
        <form data-form="ask">
          <label><input name="q" data-ask value="${esc(state.askText)}" aria-label="${esc(placeholder)}" maxlength="500" placeholder="${esc(placeholder)}" autocomplete="off"></label>
          <button type="submit" class="icon-btn" aria-label="Send">${icon.send}</button>
          <button type="button" class="icon-btn" data-like-detail aria-label="Like" aria-pressed="${n.liked}">${icon.heart(n.liked ? 'currentColor' : 'none', 23)}</button>
          <button type="button" class="icon-btn" data-save aria-label="Save" aria-pressed="${n.saved}">${icon.bookmark(n.saved ? 'currentColor' : 'none')}</button>
        </form>
      </div>
    </div>`;
  }

  function viewTabs() {
    const cur = state.tab === 'account' ? 'me' : state.tab;
    const t = (k, label, svg) => `<button data-tab="${k}" aria-label="${label}" ${cur === k ? 'aria-current="page"' : ''}>${svg}</button>`;
    return `<div class="tabs"><nav aria-label="Main">
      ${t('home', 'Home', icon.home)}
      ${t('search', 'Search', icon.search())}
      <button class="new" data-tab="post" aria-label="New note">${icon.plus()}</button>
      ${t('me', 'Profile', icon.user)}
    </nav></div>`;
  }

  function render() {
    if (!state.account) {
      $app.innerHTML = { welcome: viewWelcome, signup: viewSignup, login: viewLogin }[state.auth]();
      document.body.style.overflow = '';
      return;
    }
    const screen = { home: viewHome, search: viewSearch, post: viewPost, me: viewMe, account: viewAccount }[state.tab]();
    $app.innerHTML = screen
      + (state.tab !== 'post' ? viewTabs() : '')
      + (state.detail ? viewDetail() : '')
      + (state.sheet ? viewSheet() : '');
    document.body.style.overflow = state.detail || state.sheet ? 'hidden' : '';
  }

  // 重新渲染后把光标放回原来的输入框
  function renderKeepFocus() {
    const el = document.activeElement;
    const sel = el && (el.dataset.af ? `[data-af="${el.dataset.af}"]` : el.dataset.sf ? `[data-sf="${el.dataset.sf}"]` : null);
    render();
    if (sel) { const x = $app.querySelector(sel); if (x) x.focus(); }
  }

  // ---------- 动作 ----------
  async function go(tab) {
    state.tab = tab;
    state.detail = null;
    state.sheet = null;
    render();
    window.scrollTo(0, 0);
    try {
      if (tab === 'home' || tab === 'search') await loadNotes();
      if (tab === 'me' || tab === 'account') await loadMe();
      render();
    } catch (e) { if (state.account) toast(e.message); }
  }

  async function openNote(id) {
    try {
      state.detail = await api('/api/notes/' + id);
      state.replyTo = null;
      state.askText = '';
      render();
      try { history.pushState({ note: id }, ''); pushed = true; } catch (e) { pushed = false; }
    } catch (e) { toast(e.message); }
  }

  function closeNote() {
    state.detail = null;
    state.replyTo = null;
    render();
  }

  // 关闭详情：如果打开时加过历史记录，就用"返回"关掉，这样手机的返回手势也一致
  function leaveDetail() {
    if (pushed) { pushed = false; history.back(); } else closeNote();
  }

  async function act(path, body) {
    try {
      const n = await api(path, { method: 'POST', body: body || {} });
      replaceNote(n);
      render();
      return n;
    } catch (e) { toast(e.message); }
  }

  function openSheet(kind) {
    state.sheet = kind;
    state.sheetForm = {};
    state.sheetError = '';
    render();
    const first = $app.querySelector('.sheet input');
    if (first) first.focus();
  }

  async function saveSheet(remove) {
    const s = state.sheet;
    const f = state.sheetForm;
    const a = state.account;
    state.busy = true;
    state.sheetError = '';
    render();
    try {
      if (s === 'email' || s === 'phone') {
        const value = remove ? '' : (f[s] ?? a[s] ?? '').trim();
        if (!remove && !value) throw new Error(s === 'email' ? 'Enter an email' : 'Enter a phone number');
        state.account = await api('/api/account', { method: 'PATCH', body: { [s]: value || null, currentPassword: f.currentPassword }, noLogout: true });
        toast(remove ? (s === 'email' ? 'Email removed' : 'Phone removed') : (s === 'email' ? 'Email saved' : 'Phone saved'));
      } else if (s === 'password') {
        state.account = await api('/api/account/password', { method: 'POST', body: { currentPassword: f.currentPassword, newPassword: f.newPassword }, noLogout: true });
        toast('Password saved');
      } else if (s === 'google-off') {
        state.account = await api('/api/account/google', { method: 'DELETE', noLogout: true });
        toast('Google disconnected');
      }
      state.sheet = null;
    } catch (e) {
      state.sheetError = e.message;
    }
    state.busy = false;
    render();
  }

  // 把选的照片缩小到最长边 1280px 再上传，省流量
  function shrink(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that photo')); };
      img.src = url;
    });
  }

  let searchTimer;
  $app.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset.draft) state.draft[el.dataset.draft] = el.value;
    // 开始改输入框了，旧的错误提示就收起来
    if (el.dataset.af) { state.authForm[el.dataset.af] = el.value; if (state.authError) { state.authError = ''; $app.querySelectorAll('.err').forEach((x) => x.remove()); } }
    if (el.dataset.sf) { state.sheetForm[el.dataset.sf] = el.value; if (state.sheetError) { state.sheetError = ''; $app.querySelectorAll('.sheet .err').forEach((x) => x.remove()); } }
    if ('ask' in el.dataset) state.askText = el.value;
    if (el.dataset.input === 'query') {
      state.query = el.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(async () => {
        try {
          await loadNotes();
          const box = $app.querySelector('[data-results]');
          const lbl = $app.querySelector('[data-results-label]');
          if (box) box.innerHTML = resultRows();
          if (lbl) lbl.textContent = state.query.trim() ? 'Results' : 'Popular on campus';
        } catch (err) { toast(err.message); }
      }, 200);
    }
  });

  $app.addEventListener('change', async (e) => {
    if (!e.target.matches('[data-photos]')) return;
    const files = [...e.target.files].slice(0, 4 - state.draft.photos.length);
    try {
      for (const f of files) state.draft.photos.push(await shrink(f));
    } catch (err) { toast(err.message); }
    render();
  });

  $app.addEventListener('click', async (e) => {
    // 点面板外面的灰色区域 = 关闭
    if (e.target.matches('[data-sheet-close]')) { state.sheet = null; return render(); }
    const el = e.target.closest('button');
    if (!el) return;
    const d = el.dataset;

    // ----- 未登录页面 -----
    if (d.authGo) {
      state.auth = d.authGo;
      if (d.method) state.authMethod = d.method;
      state.authError = '';
      return render();
    }
    if (d.method) { state.authMethod = d.method; state.authError = ''; return renderKeepFocus(); }
    if ('togglePw' in d) { state.showPassword = !state.showPassword; return renderKeepFocus(); }
    if (d.google) return startGoogle(d.google);

    // ----- 登录后 -----
    if (d.tab) return go(d.tab);
    if (d.open) return openNote(Number(d.open));
    if ('close' in d) return leaveDetail();
    if (d.filter) { state.filter = d.filter; return go('home'); }
    if (d.chip) {
      state.query = d.chip;
      render();
      try { await loadNotes(); render(); } catch (err) { toast(err.message); }
      return;
    }
    if (d.agree) {
      const n = state.notes.find((x) => x.id === Number(d.agree));
      return act(`/api/notes/${d.agree}/vote`, { value: n && n.myVote === 1 ? 0 : 1 });
    }
    if (d.like) return act(`/api/notes/${d.like}/like`);
    if (d.vote) {
      const v = Number(d.vote);
      return act(`/api/notes/${state.detail.id}/vote`, { value: state.detail.myVote === v ? 0 : v });
    }
    if ('likeDetail' in d) return act(`/api/notes/${state.detail.id}/like`);
    if ('save' in d) {
      const n = await act(`/api/notes/${state.detail.id}/save`);
      if (n) toast(n.saved ? 'Saved to your profile' : 'Removed from saved');
      return;
    }
    if (d.reply) {
      // 点评论 = 回复它；再点一次取消
      const id = Number(d.reply);
      state.replyTo = state.replyTo && state.replyTo.id === id ? null : { id, author: d.replyAuthor };
      render();
      if (state.replyTo) $app.querySelector('[data-ask]').focus();
      return;
    }
    if ('cancelReply' in d) { state.replyTo = null; return render(); }
    if (d.follow) {
      try {
        const r = await api(`/api/users/${encodeURIComponent(d.follow)}/follow`, { method: 'POST' });
        state.detail.following = r.following;
        state.notes.forEach((n) => { if (n.author === d.follow) n.following = r.following; });
        render();
      } catch (err) { toast(err.message); }
      return;
    }
    if (d.worth) {
      const want = d.worth === 'yes';
      state.draft.worth = state.draft.worth === want ? null : want;
      return render();
    }
    if (d.rmPhoto) { state.draft.photos.splice(Number(d.rmPhoto), 1); return render(); }
    if ('cancel' in d) {
      // 不弹确认框：草稿保留着，下次点 + 还能接着写
      const dr = state.draft;
      if (dr.title || dr.body || dr.photos.length) toast('Draft kept');
      return go('home');
    }
    if (d.sheet) return openSheet(d.sheet);
    if ('sheetCancel' in d) { state.sheet = null; return render(); }
    if (d.sheetRemove) return saveSheet(true);
    if ('logout' in d) {
      try { await api('/api/auth/logout', { method: 'POST', noLogout: true }); } catch (err) { /* 本地照样退出 */ }
      return signedOut();
    }
    if ('reset' in d) {
      window.TROVE_LOCAL_RESET();
      state.draft = emptyDraft();
      toast('Demo data reset');
      return signedOut();
    }
  });

  $app.addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const kind = form.dataset.form;
    const f = state.authForm;

    if (kind === 'signup' || kind === 'login') {
      if (state.busy) return;
      let body;
      if (kind === 'signup') {
        const username = f.username.trim().toLowerCase();
        if (!/^[a-z0-9._]{2,20}$/.test(username)) { state.authError = 'Username: 2–20 characters, lowercase letters, numbers, . or _'; return renderKeepFocus(); }
        if (state.authMethod === 'email' && !f.email.trim()) { state.authError = 'Enter your email'; return renderKeepFocus(); }
        if (state.authMethod === 'phone' && !f.phone.trim()) { state.authError = 'Enter your phone number'; return renderKeepFocus(); }
        if (f.password.length < 8) { state.authError = 'Password must be at least 8 characters'; return renderKeepFocus(); }
        body = { username, password: f.password, [state.authMethod]: f[state.authMethod].trim() };
      } else {
        if (!f.id.trim() || !f.password) { state.authError = 'Enter your login and password'; return renderKeepFocus(); }
        body = { id: f.id.trim(), password: f.password };
      }
      state.busy = true;
      state.authError = '';
      render();
      try {
        const r = await api(kind === 'signup' ? '/api/auth/signup' : '/api/auth/login', { method: 'POST', body, noLogout: true });
        state.busy = false;
        signedIn(r);
        toast(kind === 'signup' ? 'Welcome to trove, @' + r.account.username : 'Welcome back');
      } catch (err) {
        state.busy = false;
        state.authError = err.message;
        render();
      }
      return;
    }

    if (kind === 'sheet') return saveSheet(false);

    if (kind === 'post') {
      if (state.busy) return;
      if (!state.draft.title.trim()) { toast('Add a title first'); return; }
      state.busy = true;
      render();
      try {
        await api('/api/notes', { method: 'POST', body: state.draft });
        state.draft = emptyDraft();
        state.filter = 'all';
        state.busy = false;
        toast('Posted');
        return go('home');
      } catch (err) {
        state.busy = false;
        render();
        toast(err.message);
      }
    }

    if (kind === 'ask') {
      const text = state.askText.trim();
      if (!text) return;
      const replying = state.replyTo;
      const n = await act(`/api/notes/${state.detail.id}/questions`, { text, replyTo: replying ? replying.id : null });
      if (n) {
        state.askText = '';
        state.replyTo = null;
        render();
        toast(replying ? 'Reply sent' : 'Sent');
      }
    }
  });

  // 手机上的"返回"手势关闭详情页
  window.addEventListener('popstate', () => { pushed = false; if (state.detail) closeNote(); });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (state.sheet) { state.sheet = null; render(); } else if (state.detail) leaveDetail();
  });

  // ---------- 启动 ----------
  async function boot() {
    // Google 登录回来时，结果放在网址 # 后面
    const h = new URLSearchParams(location.hash.slice(1));
    let after = null;
    if (h.get('auth')) { state.token = h.get('auth'); storage.set('trove.token', state.token); }
    if (h.get('auth_error')) state.authError = h.get('auth_error');
    if (h.get('linked')) after = 'linked';
    if ([...h.keys()].some((k) => ['auth', 'auth_error', 'linked'].includes(k))) {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ }
    }

    try { state.config = await api('/api/config'); } catch (e) { /* 用默认值 */ }

    if (state.token) {
      try {
        state.account = await api('/api/account', { noLogout: true });
      } catch (e) {
        state.token = '';
        storage.remove('trove.token');
      }
    }
    if (!state.account) return render();
    if (after === 'linked') { toast('Google connected'); return go('account'); }
    go('home');
  }

  boot();
})();

</script>
</body>
</html>
